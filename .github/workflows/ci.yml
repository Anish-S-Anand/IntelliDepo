name: MacroPulse CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: macropulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d macropulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r app/stream/macropulse/ingestion/ops/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Alembic migrations
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/macropulse_test

      - name: Run MacroPulse test suite
        run: >
          pytest
          app/stream/macropulse/ingestion/tests/test_day1_connectors.py
          app/stream/macropulse/ingestion/tests/test_day2.py
          app/stream/macropulse/ingestion/tests/test_day3.py
          app/stream/macropulse/ingestion/tests/test_day4.py
          app/stream/macropulse/ingestion/tests/test_residency.py
          app/stream/macropulse/ingestion/tests/test_integration.py
          -v --tb=short --asyncio-mode=auto
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/macropulse_test
          POSTGRES_URL: postgresql+asyncpg://postgres:test@localhost:5432/macropulse_test
          INDIA_DB_URL: postgresql+asyncpg://postgres:test@localhost:5432/macropulse_test
          GCC_DB_URL: postgresql+asyncpg://postgres:test@localhost:5432/macropulse_test
          REDIS_URL: redis://localhost:6379/0
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
