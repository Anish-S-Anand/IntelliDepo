version: "3.9"

# IntelliOps™ Production Configuration
# Multi-service compose: Next.js, FastAPI, TimescaleDB, Valkey/Redis, RabbitMQ, Prometheus
# Health checks, restart policies, resource limits

services:
  # ---- TimescaleDB (PostgreSQL with time-series extensions) ----
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: intelli-timescaledb
    environment:
      POSTGRES_USER: intelli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelli_prod_2026}
      POSTGRES_DB: intelli
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelli"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ---- Redis / Valkey (Real-time state store) ----
  redis:
    image: redis:7-alpine
    container_name: intelli-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ---- RabbitMQ (Message Queue) ----
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: intelli-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: intelli
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-intelli_mq_2026}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ---- MinIO (S3-compatible storage) ----
  minio:
    image: minio/minio:latest
    container_name: intelli-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_prod}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ---- Prometheus (Metrics Collection) ----
  prometheus:
    image: prom/prometheus:latest
    container_name: intelli-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelli-backend
    env_file: .env
    environment:
      - ALLOW_SIMULATED_CAMERA=false
      - ALLOW_SIMULATED_VISION=false
      - DATABASE_URL=postgresql+asyncpg://intelli:${POSTGRES_PASSWORD:-intelli_prod_2026}@timescaledb:5432/intelli
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://intelli:${RABBITMQ_PASSWORD:-intelli_mq_2026}@rabbitmq:5672/
      - ENABLE_DEPOT_MODULES=true
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  # ---- Frontend (Next.js) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelli-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    command: npm start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  timescaledb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
