# Prometheus Configuration for IntelliOps™
# Scrapes metrics from the FastAPI backend

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "intelli-backend"
    metrics_path: "/health/metrics/prometheus"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "intelli-platform"
          environment: "production"

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: "rabbitmq"
