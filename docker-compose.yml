version: "3.9"

# IntelliDepo — Single Docker Compose
# 3 containers: App (backend + frontend), PostgreSQL, Grafana

services:
  # ---- PostgreSQL (single database) ----
  postgres:
    image: postgres:15-alpine
    container_name: intelli-postgres
    environment:
      POSTGRES_USER: intelli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelli}
      POSTGRES_DB: intelli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelli"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Grafana (monitoring & dashboards) ----
  grafana:
    image: grafana/grafana:latest
    container_name: intelli-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- App (FastAPI backend + Next.js frontend) ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelli-app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://intelli:${POSTGRES_PASSWORD:-intelli}@postgres:5432/intelli
      - POSTGRES_URL=postgresql+asyncpg://intelli:${POSTGRES_PASSWORD:-intelli}@postgres:5432/intelli
      - ALLOW_SIMULATED_CAMERA=true
      - ALLOW_SIMULATED_VISION=true
      - ENABLE_DEPOT_MODULES=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "8000:8000"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
