services:
  # ---- PostgreSQL ----
  postgres:
    image: postgres:15-alpine
    container_name: intelli-postgres
    environment:
      POSTGRES_USER: intelli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelli}
      POSTGRES_DB: intelli
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelli"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- MinIO (S3 storage) ----
  minio:
    image: minio/minio:latest
    container_name: intelli-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ---- Zookeeper (required for Kafka) ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: intelli-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  # ---- Kafka (stable Confluent version) ----
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: intelli-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    depends_on:
      - zookeeper
    restart: unless-stopped

  # ---- Kafka UI ----
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: intelli-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: intelli-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: intelli-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- Frontend Only ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelli-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_S3_ENDPOINT: http://localhost:9000
      NEXT_PUBLIC_KAFKA_UI: http://localhost:8080
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  minio_data: